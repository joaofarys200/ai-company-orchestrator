<!doctype html>
<html lang="pt-PT">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI Company Orchestrator</title>
    <script>
      if (typeof Map.prototype.getOrInsertComputed !== "function") {
        Map.prototype.getOrInsertComputed = function (key, callbackFn) {
          if (this.has(key)) {
            return this.get(key);
          }
          var value = callbackFn(key);
          this.set(key, value);
          return value;
        };
      }
      if (typeof Map.prototype.getOrInsert !== "function") {
        Map.prototype.getOrInsert = function (key, defaultValue) {
          if (this.has(key)) {
            return this.get(key);
          }
          this.set(key, defaultValue);
          return defaultValue;
        };
      }
      if (typeof WeakMap.prototype.getOrInsertComputed !== "function") {
        WeakMap.prototype.getOrInsertComputed = function (key, callbackFn) {
          if (this.has(key)) {
            return this.get(key);
          }
          var value = callbackFn(key);
          this.set(key, value);
          return value;
        };
      }
      if (typeof WeakMap.prototype.getOrInsert !== "function") {
        WeakMap.prototype.getOrInsert = function (key, defaultValue) {
          if (this.has(key)) {
            return this.get(key);
          }
          this.set(key, defaultValue);
          return defaultValue;
        };
      }
      if (typeof Math.sumPrecise !== "function") {
        Math.sumPrecise = function (items) {
          var sum = 0;
          for (var i = 0; i < items.length; i++) {
            sum += Number(items[i]) || 0;
          }
          return sum;
        };
      }
      if (typeof Uint8Array.prototype.toHex !== "function") {
        Uint8Array.prototype.toHex = function () {
          var hex = "";
          for (var i = 0; i < this.length; i++) {
            hex += this[i].toString(16).padStart(2, "0");
          }
          return hex;
        };
      }
      if (typeof Uint8Array.fromHex !== "function") {
        Uint8Array.fromHex = function (hex) {
          var len = Math.floor(hex.length / 2);
          var bytes = new Uint8Array(len);
          for (var i = 0; i < len; i++) {
            bytes[i] = parseInt(hex.substring(i * 2, i * 2 + 2), 16);
          }
          return bytes;
        };
      }
      if (typeof Uint8Array.prototype.toBase64 !== "function") {
        Uint8Array.prototype.toBase64 = function () {
          var binary = "";
          for (var i = 0; i < this.length; i++) {
            binary += String.fromCharCode(this[i]);
          }
          return btoa(binary);
        };
      }
      if (typeof Uint8Array.fromBase64 !== "function") {
        Uint8Array.fromBase64 = function (base64) {
          var binary = atob(base64);
          var bytes = new Uint8Array(binary.length);
          for (var i = 0; i < binary.length; i++) {
            bytes[i] = binary.charCodeAt(i);
          }
          return bytes;
        };
      }
      if (typeof Promise.try !== "function") {
        Promise.try = function (fn) {
          var args = Array.prototype.slice.call(arguments, 1);
          return new Promise(function (resolve) {
            resolve(fn.apply(null, args));
          });
        };
      }
      if (typeof Promise.withResolvers !== "function") {
        Promise.withResolvers = function () {
          var resolve, reject;
          var promise = new Promise(function (res, rej) {
            resolve = res;
            reject = rej;
          });
          return { promise: promise, resolve: resolve, reject: reject };
        };
      }
    </script>
