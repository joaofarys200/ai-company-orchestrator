<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskMaster - Gestor de Tarefas</title>
    <style>
        :root {
            --primary: #4f46e5;
            --secondary: #818cf8;
            --bg: #f3f4f6;
            --text: #1f2937;
            --danger: #ef4444;
        }
        body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 2rem; display: flex; justify-content: center; min-height: 100vh; box-sizing: border-box; }
        .app-container { width: 100%; max-width: 800px; background: white; padding: 2rem; border-radius: 1rem; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); }
        h1 { margin-top: 0; color: var(--primary); text-align: center; }
        .controls { display: flex; gap: 1rem; margin-bottom: 2rem; flex-wrap: wrap; align-items: center; justify-content: space-between; background: #f9fafb; padding: 1rem; border-radius: 0.5rem; }
        input, select, button { padding: 0.75rem; border: 1px solid #d1d5db; border-radius: 0.375rem; font-size: 1rem; outline: none; transition: all 0.2s; }
        input:focus, select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.1); }
        button { cursor: pointer; background: var(--primary); color: white; font-weight: bold; border: none; display: flex; align-items: center; gap: 0.5rem; }
        button:hover { background: #4338ca; }
        .task-list { list-style: none; padding: 0; margin-top: 1rem; }
        .task-item { border-bottom: 1px solid #e5e7eb; padding: 1rem 0.5rem; display: flex; align-items: center; gap: 1rem; transition: background 0.2s; animation: fadeIn 0.3s ease-out;
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .task-item.completed span { text-decoration: line-through; color: #9ca3af; }
        .checkbox-wrapper { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; user-select: none; }
        input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--primary); cursor: pointer; }
        .task-content { flex-grow: 1; display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; word-break: break-word; }
        .delete-btn { background: #fee2e2; color: var(--danger); border: none; padding: 0.4rem 0.8rem; border-radius: 0.375rem; cursor: pointer; font-size: 0.9rem; opacity: 0.8; }
        .delete-btn:hover { background: #fecaca; opacity: 1; }
        .empty-state { text-align: center; color: #6b7280; padding: 3rem; display: none; }
    </style>
</head>
<body>
<div class="app-container">
    <h1>📋 TaskMaster</h1>
    
    <!-- Filtros e Pesquisa -->
    <div style="display:flex; gap:0.5rem; margin-bottom:1rem; flex-wrap:wrap; align-items:center;">
        <input type="text" id="searchInput" placeholder="🔍 Pesquisar tarefas..." style="flex-grow:1; min-width: 200px;">
        <select id="filterSelect" style="min-width: 150px;">
            <option value="all">Todas</option>
            <option value="active">Pendentes</option>
            <option value="completed">Concluídas</option>
        </select>
    </div>

    <!-- Formulário de Adição -->
    <form id="taskForm" class="controls">
        <input type="text" id="newTaskInput" placeholder="Nova tarefa..." required autocomplete="off">
        <button type="submit">+ Adicionar</button>
    </form>

    <!-- Lista de Tarefas -->
    <ul id="taskList" class="task-list"></ul>
    
    <div id="emptyState" class="empty-state">
        <p>Nenhuma tarefa encontrada.</p>
    </div>
</div>

<script>
(function() {
    // Estado da Aplicação
    const state = {
        tasks: JSON.parse(localStorage.getItem('tasks')) || [],
        filter: 'all',
        search: ''
    };

    // Elementos do DOM
    const els = {
        form: document.getElementById('taskForm'),
        input: document.getElementById('newTaskInput'),
        list: document.getElementById('taskList'),
        filter: document.getElementById('filterSelect'),
        search: document.getElementById('searchInput'),
        empty: document.getElementById('emptyState')
    };

    // Funções Principais
    function save() { localStorage.setItem('tasks', JSON.stringify(state.tasks)); }
    
    function render() {
        els.list.innerHTML = '';
        const filtered = state.tasks.filter(t => {
            return (state.filter === 'all' || t.completed ? state.filter === 'completed' : state.filter === 'active') &&
                   t.title.toLowerCase().includes(state.search.toLowerCase());
        });

        if (filtered.length === 0) els.empty.style.display = 'block';
        else els.empty.style.display = 'none';

        filtered.forEach(t => {
            const li = document.createElement('li');
            li.className = `task-item ${t.completed ? 'completed' : ''}`;
            li.innerHTML = `
                <label class="checkbox-wrapper">
                    <input type="checkbox" ${t.completed ? 'checked' : ''} onchange="toggleTask(${t.id})">
                </label>
                <div class="task-content">
                    <span>${escapeHtml(t.title)}</span>
                    <button class="delete-btn" onclick="deleteTask(${t.id})">Excluir</button>
                </div>
            `;
            els.list.appendChild(li);
        });
    }

    function addTask(e) {
        e.preventDefault();
        const title = els.input.value.trim();
        if (!title) return;
        state.tasks.unshift({ id: Date.now(), title, completed: false });
        save(); render();
        els.input.value = '';
    }

    function toggleTask(id) {
        const t = state.tasks.find(x => x.id === id);
        if (t) { t.completed = !t.completed; save(); render(); }
    }

    function deleteTask(id) {
        state.tasks = state.tasks.filter(t => t.id !== id);
        save(); render();
    }

    // Event Listeners
    els.form.addEventListener('submit', addTask);
    els.search.addEventListener('input', () => { render(); });
    els.filter.addEventListener('change', (e) => { state.filter = e.target.value; render(); });

    // Segurança: Escape HTML básico para prevenir XSS no input do usuário
    function escapeHtml(text) {
        return text.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
})();
</script>
</body>
</html>
