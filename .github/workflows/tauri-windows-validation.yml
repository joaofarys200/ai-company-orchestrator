name: Tauri Windows Validation (Stage 2.1)

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "stage2.1/**"
      - "migration/**"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: tauri-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tauri-windows-build:
    name: Windows Tauri 2 + Rust + Frontend Build
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Enable Git longpaths on Windows runner
        run: git config --global core.longpaths true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify repo hygiene (no local DBs/user caches committed)
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path ci-logs | Out-Null

          foreach ($required in @("src-tauri/Cargo.toml", "src-tauri/tauri.conf.json", "src-tauri/capabilities/main-window.json", "package.json", "frontend/package.json")) {
            if (-not (Test-Path $required)) {
              throw "Missing required file: $required"
            }
          }

          $forbidden = Get-ChildItem -Force -Recurse -ErrorAction SilentlyContinue | Where-Object {
            $_.FullName -match '\\database\.db' -or
            $_.FullName -match '\\data\\study\\documents\\' -or
            $_.FullName -match '\\data\\study\\videos_cache\\'
          }
          if ($forbidden) {
            throw "Forbidden runtime/database artifacts found in checkout: $($forbidden.FullName -join ', ')"
          }

          "Repository hygiene verified." | Tee-Object -FilePath ci-logs/hygiene.log

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Setup Rust MSVC toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.100.0"
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Inspect toolchain versions
        run: |
          $ErrorActionPreference = 'Continue'
          @(
            "node: $(node --version)"
            "npm: $(npm --version)"
            "python: $(python --version)"
            "rustc: $(rustc --version)"
            "cargo: $(cargo --version)"
            "os: $([System.Environment]::OSVersion.VersionString)"
          ) | Tee-Object -FilePath ci-logs/toolchain.log

      - name: Install root dependencies from lockfile
        run: |
          $ErrorActionPreference = 'Continue'
          npm ci --ignore-scripts 2>&1 | ForEach-Object { if ($null -ne $_) { $_.ToString() } else { "" } } | Tee-Object -FilePath ci-logs/npm-ci-root.log
          $code = $LASTEXITCODE
          "exit_code=$code" | Add-Content ci-logs/npm-ci-root.log
          exit $code

      - name: Install frontend dependencies from lockfile
        run: |
          $ErrorActionPreference = 'Continue'
          npm --prefix frontend ci 2>&1 | ForEach-Object { if ($null -ne $_) { $_.ToString() } else { "" } } | Tee-Object -FilePath ci-logs/npm-ci-frontend.log
          $code = $LASTEXITCODE
          "exit_code=$code" | Add-Content ci-logs/npm-ci-frontend.log
          exit $code

      - name: Collect Tauri environment info
        run: |
          $ErrorActionPreference = 'Continue'
          npm exec -- tauri info 2>&1 | ForEach-Object { if ($null -ne $_) { $_.ToString() } else { "" } } | Tee-Object -FilePath ci-logs/tauri-info.log
          exit 0

      - name: Run frontend transport & type tests
        run: |
          $ErrorActionPreference = 'Continue'
          npm --prefix frontend test 2>&1 | ForEach-Object { if ($null -ne $_) { $_.ToString() } else { "" } } | Tee-Object -FilePath ci-logs/frontend-test.log
          $code = $LASTEXITCODE
          "exit_code=$code" | Add-Content ci-logs/frontend-test.log
          exit $code

      - name: Build React + TypeScript frontend
        run: |
          $ErrorActionPreference = 'Continue'
          npm --prefix frontend run build 2>&1 | ForEach-Object { if ($null -ne $_) { $_.ToString() } else { "" } } | Tee-Object -FilePath ci-logs/frontend-build.log
          $code = $LASTEXITCODE
          "exit_code=$code" | Add-Content ci-logs/frontend-build.log
          exit $code

      - name: Run Python core contract, worker E2E & hardening tests
        run: |
          $ErrorActionPreference = 'Continue'
          python -m pip install --quiet pytest pyyaml jsonschema websockets httpx python-dotenv psutil pillow numpy python-docx pymupdf pdfplumber cryptography
          python -m pytest -q tests/test_sqlite_hardening.py tests/test_rho_migration_sandbox.py tests/test_documentation_integrity.py tests/test_transport_gateway.py tests/test_worker_stdio_rpc.py tests/test_security_hardening_phase3.py tests/test_domain_workers_phase3.py tests/test_e2e_workers_all_roles.py tests/test_protocol_contracts.py 2>&1 | ForEach-Object { if ($null -ne $_) { $_.ToString() } else { "" } } | Tee-Object -FilePath ci-logs/python-contract-tests.log
          $code1 = $LASTEXITCODE
          python -m pytest -q tests/test_smoke.py tests/test_application_lifecycle.py tests/test_stage1_backend_integrity.py tests/test_mission_websocket_schema.py tests/test_server_websocket_characterization.py tests/test_study_agent_session_isolation.py tests/test_voice_readonly_access.py tests/test_runtime_security.py tests/test_websocket_dispatcher_contract.py 2>&1 | ForEach-Object { if ($null -ne $_) { $_.ToString() } else { "" } } | Tee-Object -FilePath ci-logs/python-contract-tests.log -Append
          $code2 = $LASTEXITCODE
          $code = if ($code1 -ne 0) { $code1 } else { $code2 }
          "exit_code_pass1=$code1 exit_code_pass2=$code2 exit_code=$code" | Add-Content ci-logs/python-contract-tests.log
          exit $code

      - name: Run cargo check (--locked --all-targets)
        run: |
          $ErrorActionPreference = 'Continue'
          cargo check --manifest-path src-tauri/Cargo.toml --locked --all-targets 2>&1 | ForEach-Object { if ($null -ne $_) { $_.ToString() } else { "" } } | Tee-Object -FilePath ci-logs/cargo-check.log
          $code = $LASTEXITCODE
          "exit_code=$code" | Add-Content ci-logs/cargo-check.log
          exit $code

      - name: Run cargo test (--locked)
        run: |
          $ErrorActionPreference = 'Continue'
          cargo test --manifest-path src-tauri/Cargo.toml --locked -- --nocapture 2>&1 | ForEach-Object { if ($null -ne $_) { $_.ToString() } else { "" } } | Tee-Object -FilePath ci-logs/cargo-test.log
          $code = $LASTEXITCODE
          "exit_code=$code" | Add-Content ci-logs/cargo-test.log
          exit $code

      - name: Build Tauri release binary (--no-bundle)
        run: |
          $ErrorActionPreference = 'Continue'
          npm run tauri:build -- --no-bundle 2>&1 | ForEach-Object { if ($null -ne $_) { $_.ToString() } else { "" } } | Tee-Object -FilePath ci-logs/tauri-build-no-bundle.log
          $code = $LASTEXITCODE
          "exit_code=$code" | Add-Content ci-logs/tauri-build-no-bundle.log
          if ($code -eq 0 -and (Test-Path "src-tauri/target/release/jarvis-os.exe")) {
            Get-Item "src-tauri/target/release/jarvis-os.exe" | Select-Object Name, Length | Out-String | Add-Content ci-logs/tauri-build-no-bundle.log
          }
          exit $code

      - name: Verify built jarvis-os.exe binary boot & SQLite initialization
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Resolve-Path "src-tauri/target/release/jarvis-os.exe"
          $tmpRoot = Join-Path $env:RUNNER_TEMP ("jarvis_smoke_" + [System.Guid]::NewGuid().ToString("N"))
          New-Item -ItemType Directory -Force -Path $tmpRoot | Out-Null
          "smoke_root=$tmpRoot" | Tee-Object -FilePath ci-logs/tauri-binary-smoke.log
          $prevRoot = $env:JARVIS_PROJECT_ROOT
          $env:JARVIS_PROJECT_ROOT = $tmpRoot
          $proc = Start-Process -FilePath $exe.Path -WorkingDirectory (Get-Location).Path -PassThru -WindowStyle Hidden
          try {
            Start-Sleep -Seconds 6
            $proc.Refresh()
            if ($proc.HasExited) {
              throw "jarvis-os.exe exited prematurely with exit code $($proc.ExitCode)"
            }
            $dbPath = Join-Path $tmpRoot "database.db"
            $studyDbPath = Join-Path $tmpRoot "data\study\study.db"
            if (-not (Test-Path $dbPath)) {
              throw "Expected Rust Core SQLite database to initialize at $dbPath"
            }
            if (-not (Test-Path $studyDbPath)) {
              throw "Expected Rust Core StudyStore database to initialize at $studyDbPath"
            }
            $dbLen = (Get-Item $dbPath).Length
            $studyDbLen = (Get-Item $studyDbPath).Length
            $rssMb = [math]::Round($proc.WorkingSet64 / 1MB, 2)
            "alive=True pid=$($proc.Id) rss_mb=$rssMb db_bytes=$dbLen study_db_bytes=$studyDbLen" | Add-Content ci-logs/tauri-binary-smoke.log
            "exit_code=0" | Add-Content ci-logs/tauri-binary-smoke.log
          } finally {
            $env:JARVIS_PROJECT_ROOT = $prevRoot
            if ($null -ne $proc -and -not $proc.HasExited) {
              Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
              $proc.WaitForExit(5000) | Out-Null
            }
            if ($null -ne $proc) {
              Get-CimInstance Win32_Process -Filter "ParentProcessId = $($proc.Id)" -ErrorAction SilentlyContinue | ForEach-Object {
                Stop-Process -Id $_.ProcessId -Force -ErrorAction SilentlyContinue
              }
            }
            Start-Sleep -Milliseconds 300
            Remove-Item -Recurse -Force $tmpRoot -ErrorAction SilentlyContinue
          }

      - name: Write workflow summary
        if: always()
        run: |
          $ErrorActionPreference = 'Continue'
          Add-Content $env:GITHUB_STEP_SUMMARY "## JARVIS OS — Tauri Windows Validation"
          Add-Content $env:GITHUB_STEP_SUMMARY ""
          foreach ($log in @("toolchain.log", "tauri-info.log", "frontend-test.log", "frontend-build.log", "python-contract-tests.log", "cargo-check.log", "cargo-test.log", "tauri-build-no-bundle.log", "tauri-binary-smoke.log")) {
            $path = Join-Path "ci-logs" $log
            if (Test-Path $path) {
              $tail = Get-Content $path -Tail 20
              Add-Content $env:GITHUB_STEP_SUMMARY "### $log (tail)"
              Add-Content $env:GITHUB_STEP_SUMMARY '```'
              $tail | Add-Content $env:GITHUB_STEP_SUMMARY
              Add-Content $env:GITHUB_STEP_SUMMARY '```'
            }
          }

      - name: Upload CI validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-windows-ci-logs-${{ github.run_number }}
          path: ci-logs/**
          retention-days: 14
